server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      # The app logs structured JSON (Spring Boot's logstash format, see
      # application.yml's logging.structured.* properties). Parsing here keeps
      # `level` as a low-cardinality Loki label for fast filtering, while traceId/
      # userId/logger stay in the log body, queryable ad hoc via `| json` in Grafana
      # Explore rather than as indexed labels (which would blow up label cardinality).
      - json:
          expressions:
            level: level
      - labels:
          level:
          container:
