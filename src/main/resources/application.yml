spring:
  application:
    name: doodle-challenge
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/doodle
    username: doodle
    password: doodle
    hikari:
      # Fail fast if the pool is exhausted rather than hanging the (virtual) request
      # thread indefinitely waiting for a connection.
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # JPA-standard query timeout (ms), applied to every query issued through the
      # EntityManager - including Spring Data derived/@Query methods, not just ones
      # annotated individually. Bounds how long a single DB round trip can run.
      jakarta.persistence.query.timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    async:
      # Ceiling for any async-processed request (Callable/DeferredResult return types).
      # None of the current endpoints use those, but this sets the default up front.
      request-timeout: 10000

server:
  port: 8080
  tomcat:
    # Time Tomcat waits to finish receiving a request before giving up on a slow client.
    connection-timeout: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0


logging:
  structured:
    format:
      console: logstash
