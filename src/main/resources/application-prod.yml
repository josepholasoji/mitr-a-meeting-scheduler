# Production-profile overrides. Not activated by docker-compose (which intentionally
# runs the default profile, matching this project's local/demo scope) - provided so a
# production deployment can opt in with SPRING_PROFILES_ACTIVE=prod.
logging:
  level:
    root: WARN
    com.doodle.challenge: INFO

management:
  endpoints:
    web:
      exposure:
        # Narrower than the default profile's list - metrics/health only, no thread
        # dumps, in a real deployment.
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
